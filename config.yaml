inputs:
  expression: original_input/all_human_miRNA_rpmm_harmonized_meta_data.h5ad
  metadata: original_input/human_combined.tsv
  high_confidence_mirnas: resources/high_confidence_mirnas.txt

cohort:
  tissue: blood
  biotype: tissue
  # Disease_Condition labels (case-insensitive) treated as healthy
  healthy_labels: ["healthy", "healthy control", "healthy controls", "control", "c", "normal control"]
  min_age: 30
  max_age: 85
  sexes: ["m", "f"]

# Age bins for the balanced MAE and the residual plots
age_bins: [30, 40, 50, 60, 70, 85]

preprocessing:
  min_rpmm: 1.0         # prevalence filter: RPMM > min_rpmm ...
  min_fraction: 0.2     # ... in at least this fraction of training samples
  zscore_min_samples: 5 # projects with fewer samples use the global training mean/sd

cv:
  n_splits: 5
  n_repeats: 10
  inner_splits: 5
  random_state: 42

models: ["mean", "linear", "elastic_net", "hgb", "mlp"]

# Leave-project-out: projects with at least this many samples are reported on their own
min_project_size: 30

threads: 12
